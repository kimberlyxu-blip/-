<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部门分组抽签系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
        }
        .lottery-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .lottery-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .modal {
            transition: opacity 0.25s ease;
        }
        body.modal-active {
            overflow-x: hidden;
            overflow-y: hidden !important;
        }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm py-4 px-6 flex justify-between items-center z-10 relative">
        <h1 class="text-2xl font-bold text-indigo-600 flex items-center gap-2">
            <i class="fas fa-users-viewfinder"></i> 分组抽签系统
        </h1>
        <button id="adminLoginBtn" class="text-sm text-gray-500 hover:text-indigo-600 font-medium transition-colors">
            <i class="fas fa-lock"></i> 管理员登录
        </button>
        <div id="adminHeaderMenu" class="hidden flex items-center gap-4">
             <span class="text-sm font-semibold text-green-600"><i class="fas fa-check-circle"></i> 已登录 (管理员)</span>
             <button id="adminLogoutBtn" class="text-sm text-red-500 hover:text-red-700 font-medium transition-colors">退出</button>
             <button id="viewUserModeBtn" class="text-sm text-indigo-500 hover:text-indigo-700 font-medium transition-colors">返回抽签页</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow flex items-center justify-center p-4 relative overflow-hidden">
        
        <!-- Background Elements -->
        <div class="absolute inset-0 overflow-hidden pointer-events-none">
            <div class="absolute -top-1/2 -right-1/4 w-96 h-96 bg-indigo-100 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob"></div>
            <div class="absolute top-1/2 -left-1/4 w-72 h-72 bg-blue-100 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob animation-delay-2000"></div>
            <div class="absolute -bottom-1/2 left-1/2 w-80 h-80 bg-purple-100 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob animation-delay-4000"></div>
        </div>

        <div id="userView" class="w-full max-w-md relative z-10 transition-opacity duration-300">
            <div class="bg-white rounded-2xl shadow-xl overflow-hidden lottery-card border border-gray-100">
                <div class="bg-gradient-to-r from-indigo-500 to-purple-600 p-6 text-center">
                    <h2 class="text-3xl font-extrabold text-white mb-2">好运抽签</h2>
                    <p class="text-indigo-100 text-sm">输入姓名，点击抽取你的专属小组</p>
                </div>
                
                <div class="p-8">
                    <div id="drawingArea">
                        <div class="mb-6">
                            <label for="userName" class="block text-sm font-medium text-gray-700 mb-2">你的姓名</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fas fa-user text-gray-400"></i>
                                </div>
                                <input type="text" id="userName" name="userName" class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-shadow" placeholder="例如：张三" autocomplete="off">
                            </div>
                            <p id="nameError" class="text-red-500 text-xs mt-1 hidden">请输入您的姓名</p>
                        </div>
                        
                        <button id="drawBtn" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                            开始抽签 <i class="fas fa-dice ml-2 mt-0.5"></i>
                        </button>

                        <div id="loadingStatus" class="hidden mt-4 text-center">
                            <i class="fas fa-circle-notch fa-spin text-indigo-500 text-2xl"></i>
                            <p class="text-gray-500 text-sm mt-2">正在分配中，请稍候...</p>
                        </div>
                    </div>

                    <!-- Result Area -->
                    <div id="resultArea" class="hidden text-center py-6">
                        <div class="mb-4 inline-flex items-center justify-center w-20 h-20 rounded-full bg-green-100 text-green-500">
                            <i class="fas fa-check text-4xl"></i>
                        </div>
                        <h3 class="text-2xl font-bold text-gray-900 mb-2">抽签成功！</h3>
                        <p class="text-gray-600 mb-6">你好 <span id="resultName" class="font-bold text-indigo-600"></span>，你已被分配到：</p>
                        <div class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 to-purple-600 mb-6 pb-2">
                            第 <span id="resultGroup">X</span> 组
                        </div>
                        <p class="text-xs text-gray-400">请记住您的组别。如有问题请联系管理员。</p>
                        <button id="resetDrawBtn" class="mt-6 text-sm text-indigo-600 hover:text-indigo-800 underline hidden">重新抽签 (测试用)</button>
                    </div>
                </div>
            </div>
            
            <!-- Global Stats Preview -->
            <div class="mt-6 text-center text-sm text-gray-500 flex justify-center gap-6">
                <span>总名额: 50</span>
                <span>每组上限: 10</span>
                <span>已分配: <span id="totalAssignedCount" class="font-bold text-indigo-600">0</span></span>
            </div>
        </div>

        <div id="adminView" class="hidden w-full max-w-6xl mx-auto z-10 transition-opacity duration-300 h-full flex flex-col pb-6">
            <div class="mb-6 flex justify-between items-end">
                <div>
                    <h2 class="text-3xl font-bold text-gray-800">管理员控制台</h2>
                    <p class="text-gray-500 mt-1">实时查看分组情况，支持手动调整。</p>
                </div>
                <div class="flex gap-3">
                     <button id="refreshDataBtn" class="bg-white border border-gray-300 text-gray-700 py-2 px-4 rounded-lg shadow-sm hover:bg-gray-50 transition-colors text-sm font-medium flex items-center gap-2">
                        <i class="fas fa-sync-alt"></i> 手动刷新
                    </button>
                    <button id="clearAllBtn" class="bg-red-50 border border-red-200 text-red-600 py-2 px-4 rounded-lg shadow-sm hover:bg-red-100 transition-colors text-sm font-medium flex items-center gap-2">
                        <i class="fas fa-trash-alt"></i> 清空所有数据
                    </button>
                </div>
            </div>

            <!-- Dashboard Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-6 overflow-y-auto flex-grow pr-2 custom-scrollbar">
                <!-- Group Cards will be generated here by JS -->
            </div>
        </div>

    </main>

    
    <!-- Admin Login Modal -->
    <div id="loginModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 z-50 hidden flex items-center justify-center modal opacity-0 pointer-events-none">
        <div class="bg-white rounded-xl shadow-2xl p-8 max-w-sm w-full transform scale-95 transition-transform duration-200">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-gray-900">管理员登录</h3>
                <button id="closeLoginModal" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
            </div>
            <div class="mb-4">
                <label for="adminPassword" class="block text-sm font-medium text-gray-700 mb-2">密码 (演示密码: 12345)</label>
                <input type="password" id="adminPassword" class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="输入管理员密码">
                <p id="loginError" class="text-red-500 text-xs mt-2 hidden">密码错误</p>
            </div>
            <button id="doLoginBtn" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                登录
            </button>
        </div>
    </div>

    <!-- Manual Add Member Modal -->
    <div id="addMemberModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 z-50 hidden flex items-center justify-center modal opacity-0 pointer-events-none">
        <div class="bg-white rounded-xl shadow-2xl p-8 max-w-sm w-full transform scale-95 transition-transform duration-200">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-gray-900">手动添加成员</h3>
                <button id="closeAddModal" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
            </div>
            <p class="text-sm text-gray-500 mb-4">正在添加到: <span id="targetGroupName" class="font-bold text-indigo-600">第 1 组</span></p>
            <div class="mb-4">
                <label for="newMemberName" class="block text-sm font-medium text-gray-700 mb-2">成员姓名</label>
                <input type="text" id="newMemberName" class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="输入姓名">
                <p id="addError" class="text-red-500 text-xs mt-2 hidden">姓名不能为空或该组已满(10人)</p>
            </div>
            <input type="hidden" id="targetGroupId">
            <button id="doAddMemberBtn" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                确认添加
            </button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        <div class="bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3">
            <i id="toastIcon" class="fas fa-info-circle text-blue-400"></i>
            <span id="toastMessage" class="text-sm font-medium">通知消息</span>
        </div>
    </div>

    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #c7c7cc; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #a0a0a5; 
        }
        
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
        .animation-delay-4000 {
            animation-delay: 4s;
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, query, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Environment Variables & Mode Check
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'demo-team-assigner-' + Math.random().toString(36).substring(7);
        const isCloudMode = typeof __firebase_config !== 'undefined';
        const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let app, db, auth;
        
        if (isCloudMode) {
            const firebaseConfig = JSON.parse(__firebase_config);
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } else {
            console.warn("⚠️ 检测到本地环境：已切换至本地演示模式。数据不会保存到云端。");
        }
        
        // App State
        const TOTAL_GROUPS = 5;
        const MAX_PER_GROUP = 10;
        let currentUserUid = null;
        let isAdmin = false;
        let localDataCache = {
            group1: [], group2: [], group3: [], group4: [], group5: []
        };
        let unsubscribeListeners = [];

        // DOM Elements
        const els = {
            userView: document.getElementById('userView'),
            adminView: document.getElementById('adminView'),
            adminLoginBtn: document.getElementById('adminLoginBtn'),
            adminHeaderMenu: document.getElementById('adminHeaderMenu'),
            adminLogoutBtn: document.getElementById('adminLogoutBtn'),
            viewUserModeBtn: document.getElementById('viewUserModeBtn'),
            userNameInput: document.getElementById('userName'),
            drawBtn: document.getElementById('drawBtn'),
            nameError: document.getElementById('nameError'),
            loadingStatus: document.getElementById('loadingStatus'),
            drawingArea: document.getElementById('drawingArea'),
            resultArea: document.getElementById('resultArea'),
            resultName: document.getElementById('resultName'),
            resultGroup: document.getElementById('resultGroup'),
            totalAssignedCount: document.getElementById('totalAssignedCount'),
            adminGrid: document.querySelector('#adminView .grid'),
            clearAllBtn: document.getElementById('clearAllBtn'),
            refreshDataBtn: document.getElementById('refreshDataBtn'),
            loginModal: document.getElementById('loginModal'),
            adminPassword: document.getElementById('adminPassword'),
            doLoginBtn: document.getElementById('doLoginBtn'),
            closeLoginModal: document.getElementById('closeLoginModal'),
            loginError: document.getElementById('loginError'),
            addMemberModal: document.getElementById('addMemberModal'),
            newMemberName: document.getElementById('newMemberName'),
            doAddMemberBtn: document.getElementById('doAddMemberBtn'),
            closeAddModal: document.getElementById('closeAddModal'),
            targetGroupName: document.getElementById('targetGroupName'),
            targetGroupId: document.getElementById('targetGroupId'),
            addError: document.getElementById('addError'),
            toast: document.getElementById('toast'),
            toastMessage: document.getElementById('toastMessage'),
            toastIcon: document.getElementById('toastIcon')
        };

        async function initAuth() {
            if (!isCloudMode) {
                // Local demo mode setup
                currentUserUid = 'local-user';
                setupRealtimeListeners();
                return;
            }

            try {
                if (initialToken) {
                    const userCredential = await signInWithCustomToken(auth, initialToken);
                    currentUserUid = userCredential.user.uid;
                } else {
                    const userCredential = await signInAnonymously(auth);
                    currentUserUid = userCredential.user.uid;
                }
                setupRealtimeListeners();
                checkUserPreviousDraw();
            } catch (error) {
                console.error("Auth Error:", error);
                showToast("连接服务器失败，部分云功能可能受限", "error");
            }
        }

        const getGroupCollectionPath = () => collection(db, 'artifacts', appId, 'public', 'data', 'groups');
        const getGroupDocRef = (groupId) => doc(db, 'artifacts', appId, 'public', 'data', 'groups', groupId);
        const getUserDrawRef = () => doc(db, 'artifacts', appId, 'users', currentUserUid, 'drawStatus', 'record');

        async function initGroupsIfNeeded() {
            if (!isCloudMode || !currentUserUid) return;
            try {
                for (let i = 1; i <= TOTAL_GROUPS; i++) {
                    const gRef = getGroupDocRef(`group${i}`);
                    const docSnap = await getDoc(gRef);
                    if (!docSnap.exists()) {
                        await setDoc(gRef, { id: i, name: `第 ${i} 组`, members: [], updatedAt: new Date().toISOString() });
                    }
                }
            } catch (error) {
                console.error("Error initializing groups:", error);
            }
        }

        function setupRealtimeListeners() {
            if (!isCloudMode) {
                updateTotalAssignedUI();
                if (isAdmin) renderAdminDashboard();
                return;
            }

            if (!currentUserUid) return;
            unsubscribeListeners.forEach(unsub => unsub());
            unsubscribeListeners = [];
            
            const q = query(getGroupCollectionPath());
            const unsub = onSnapshot(q, (snapshot) => {
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data && data.members) localDataCache[doc.id] = data.members;
                });
                updateTotalAssignedUI();
                if (isAdmin) renderAdminDashboard();
            }, (error) => {
                console.error("Snapshot error:", error);
                showToast("数据同步断开", "error");
            });
            unsubscribeListeners.push(unsub);
            initGroupsIfNeeded();
        }

        async function checkUserPreviousDraw() {
            if (!isCloudMode || !currentUserUid) return;
            try {
                const drawRecord = await getDoc(getUserDrawRef());
                if (drawRecord.exists()) {
                    const data = drawRecord.data();
                    showResult(data.name, data.groupNum);
                }
            } catch (e) {
                console.error("Error checking draw status", e);
            }
        }

        function updateTotalAssignedUI() {
            let totalAssigned = 0;
            for(let key in localDataCache) {
                totalAssigned += localDataCache[key].length;
            }
            els.totalAssignedCount.innerText = totalAssigned;
        }

        async function handleDraw() {
            const name = els.userNameInput.value.trim();
            if (!name) {
                els.nameError.classList.remove('hidden');
                return;
            }
            els.nameError.classList.add('hidden');
            
            let isNameExists = false;
            for(let key in localDataCache) {
                if(localDataCache[key].includes(name)) {
                    isNameExists = true;
                    break;
                }
            }
            if(isNameExists && !isAdmin) {
                 showToast("该姓名已经参与过抽签", "warning");
                 return;
            }

            setLoading(true);

            // Determine available groups
            let availableGroups = [];
            for (let i = 1; i <= TOTAL_GROUPS; i++) {
                const gKey = `group${i}`;
                if ((localDataCache[gKey] || []).length < MAX_PER_GROUP) {
                    availableGroups.push(i);
                }
            }

            if (availableGroups.length === 0) {
                showToast("所有小组均已满员！", "error");
                setLoading(false);
                return;
            }

            const randomGroupNum = availableGroups[Math.floor(Math.random() * availableGroups.length)];
            const targetGroupId = `group${randomGroupNum}`;

            try {
                if (!isCloudMode) {
                    // Local execution
                    setTimeout(() => {
                        localDataCache[targetGroupId].push(name);
                        updateTotalAssignedUI();
                        if(isAdmin) renderAdminDashboard();
                        showResult(name, randomGroupNum);
                        showToast(`抽签成功！你被分配到第 ${randomGroupNum} 组`, "success");
                        setLoading(false);
                    }, 800); // Simulate network delay
                    return;
                }

                // Cloud execution
                const gRef = getGroupDocRef(targetGroupId);
                const docSnap = await getDoc(gRef);
                if (docSnap.exists()) {
                    let members = docSnap.data().members || [];
                    if(members.length >= MAX_PER_GROUP) {
                         showToast("名额刚被抢占，请重试", "warning");
                         setLoading(false);
                         return;
                    }
                    members.push(name);
                    await updateDoc(gRef, { members: members, updatedAt: new Date().toISOString() });
                }
                
                await setDoc(getUserDrawRef(), { name: name, groupNum: randomGroupNum, timestamp: new Date().toISOString() });
                showResult(name, randomGroupNum);
                showToast(`抽签成功！你被分配到第 ${randomGroupNum} 组`, "success");

            } catch (error) {
                console.error("Draw failed:", error);
                showToast("抽签失败，请重试", "error");
            } finally {
                if(isCloudMode) setLoading(false);
            }
        }

        function setLoading(isLoading) {
            if (isLoading) {
                els.drawBtn.disabled = true;
                els.drawBtn.innerHTML = '抽取中...';
                els.loadingStatus.classList.remove('hidden');
            } else {
                els.drawBtn.disabled = false;
                els.drawBtn.innerHTML = '开始抽签 <i class="fas fa-dice ml-2 mt-0.5"></i>';
                els.loadingStatus.classList.add('hidden');
            }
        }

        function showResult(name, groupNum) {
            els.drawingArea.classList.add('hidden');
            els.resultArea.classList.remove('hidden');
            els.resultName.innerText = name;
            els.resultGroup.innerText = groupNum;
        }

        function toggleAdminMode(enable) {
            isAdmin = enable;
            if (enable) {
                els.adminLoginBtn.classList.add('hidden');
                els.adminHeaderMenu.classList.remove('hidden');
                switchToAdminView();
            } else {
                els.adminLoginBtn.classList.remove('hidden');
                els.adminHeaderMenu.classList.add('hidden');
                switchToUserView();
            }
        }

        function switchToAdminView() {
            els.userView.classList.add('opacity-0');
            setTimeout(() => {
                els.userView.classList.add('hidden');
                els.adminView.classList.remove('hidden');
                void els.adminView.offsetWidth;
                els.adminView.classList.remove('opacity-0');
                renderAdminDashboard();
            }, 300);
        }

        function switchToUserView() {
            els.adminView.classList.add('opacity-0');
            setTimeout(() => {
                els.adminView.classList.add('hidden');
                els.userView.classList.remove('hidden');
                void els.userView.offsetWidth;
                els.userView.classList.remove('opacity-0');
            }, 300);
        }

        function renderAdminDashboard() {
            if (!isAdmin) return;
            els.adminGrid.innerHTML = '';
            
            for (let i = 1; i <= TOTAL_GROUPS; i++) {
                const gKey = `group${i}`;
                const members = localDataCache[gKey] || [];
                const isFull = members.length >= MAX_PER_GROUP;
                
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col h-full';
                let headerColor = isFull ? 'bg-red-50 text-red-700 border-red-100' : 'bg-indigo-50 text-indigo-700 border-indigo-100';
                
                let html = `
                    <div class="px-4 py-3 border-b ${headerColor} flex justify-between items-center">
                        <h3 class="font-bold">第 ${i} 组</h3>
                        <span class="text-xs font-semibold px-2 py-1 rounded-full ${isFull ? 'bg-red-100' : 'bg-indigo-100'}">
                            ${members.length} / ${MAX_PER_GROUP}
                        </span>
                    </div>
                    <div class="p-4 flex-grow overflow-y-auto custom-scrollbar" style="max-height: 300px;">
                `;
                
                if (members.length === 0) {
                    html += `<div class="text-center py-6 text-gray-400 text-sm"><i class="fas fa-inbox mb-2 text-2xl opacity-50 block"></i> 暂无成员</div>`;
                } else {
                    html += `<ul class="divide-y divide-gray-100">`;
                    members.forEach((member, index) => {
                        html += `
                            <li class="py-2.5 flex justify-between items-center group">
                                <div class="flex items-center gap-2">
                                    <span class="text-xs text-gray-400 w-4">${index + 1}.</span>
                                    <span class="text-sm font-medium text-gray-800">${escapeHtml(member)}</span>
                                </div>
                                <button onclick="window.removeMember('${gKey}', '${escapeHtml(member)}')" class="text-red-400 hover:text-red-600 opacity-0 group-hover:opacity-100 transition-opacity" title="移除">
                                    <i class="fas fa-user-minus"></i>
                                </button>
                            </li>
                        `;
                    });
                    html += `</ul>`;
                }
                
                html += `</div>
                    <div class="p-3 border-t border-gray-100 bg-gray-50">
                        <button onclick="window.openAddModal('${gKey}', ${i})" class="w-full text-sm text-indigo-600 hover:text-indigo-800 font-medium flex justify-center items-center gap-1 py-1 ${isFull ? 'opacity-50 cursor-not-allowed pointer-events-none' : ''}">
                            <i class="fas fa-plus"></i> 添加成员
                        </button>
                    </div>
                `;
                card.innerHTML = html;
                els.adminGrid.appendChild(card);
            }
        }

        window.removeMember = async function(groupId, memberName) {
            if (!confirm(`确定要从该组移除成员 "${memberName}" 吗？`)) return;
            
            if (!isCloudMode) {
                const index = localDataCache[groupId].indexOf(memberName);
                if (index > -1) {
                    localDataCache[groupId].splice(index, 1);
                    updateTotalAssignedUI();
                    renderAdminDashboard();
                    showToast(`已移除成员: ${memberName}`, "success");
                }
                return;
            }

            try {
                const gRef = getGroupDocRef(groupId);
                const docSnap = await getDoc(gRef);
                if (docSnap.exists()) {
                    let members = docSnap.data().members || [];
                    const index = members.indexOf(memberName);
                    if (index > -1) {
                        members.splice(index, 1);
                        await updateDoc(gRef, { members: members, updatedAt: new Date().toISOString() });
                        showToast(`已移除成员: ${memberName}`, "success");
                    }
                }
            } catch (e) {
                console.error("Remove failed", e);
                showToast("移除失败", "error");
            }
        };

        window.openAddModal = function(groupId, groupNum) {
            els.targetGroupId.value = groupId;
            els.targetGroupName.innerText = `第 ${groupNum} 组`;
            els.newMemberName.value = '';
            els.addError.classList.add('hidden');
            openModal(els.addMemberModal);
        };

        async function manualAddMember() {
            const groupId = els.targetGroupId.value;
            const name = els.newMemberName.value.trim();
            
            if (!name) {
                els.addError.innerText = "姓名不能为空";
                els.addError.classList.remove('hidden');
                return;
            }

            if (!isCloudMode) {
                if (localDataCache[groupId].length >= MAX_PER_GROUP) {
                    els.addError.innerText = "该组已满员";
                    els.addError.classList.remove('hidden');
                    return;
                }
                if (localDataCache[groupId].includes(name)) {
                    els.addError.innerText = "该组成员已存在同名";
                    els.addError.classList.remove('hidden');
                    return;
                }
                localDataCache[groupId].push(name);
                updateTotalAssignedUI();
                renderAdminDashboard();
                closeModal(els.addMemberModal);
                showToast(`已将 ${name} 添加到该组`, "success");
                return;
            }

            try {
                const gRef = getGroupDocRef(groupId);
                const docSnap = await getDoc(gRef);
                if (docSnap.exists()) {
                    let members = docSnap.data().members || [];
                    if (members.length >= MAX_PER_GROUP) {
                        els.addError.innerText = "该组已满员";
                        els.addError.classList.remove('hidden');
                        return;
                    }
                    if (members.includes(name)) {
                        els.addError.innerText = "该组成员已存在同名";
                        els.addError.classList.remove('hidden');
                        return;
                    }
                    
                    members.push(name);
                    await updateDoc(gRef, { members: members, updatedAt: new Date().toISOString() });
                    closeModal(els.addMemberModal);
                    showToast(`已将 ${name} 添加到该组`, "success");
                }
            } catch (e) {
                console.error("Add failed", e);
                showToast("添加失败", "error");
            }
        }

        async function clearAllData() {
            if (!confirm("⚠️ 危险操作！\n确定要清空所有分组数据吗？此操作不可恢复！")) return;
            
            const btn = els.clearAllBtn;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 清空中...';
            
            if (!isCloudMode) {
                for (let i = 1; i <= TOTAL_GROUPS; i++) {
                    localDataCache[`group${i}`] = [];
                }
                updateTotalAssignedUI();
                renderAdminDashboard();
                showToast("所有数据已清空", "success");
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-trash-alt"></i> 清空所有数据';
                return;
            }

            try {
                for (let i = 1; i <= TOTAL_GROUPS; i++) {
                    const gRef = getGroupDocRef(`group${i}`);
                    await updateDoc(gRef, { members: [], updatedAt: new Date().toISOString() });
                }
                showToast("所有数据已清空", "success");
            } catch (e) {
                console.error("Clear failed", e);
                showToast("清空失败", "error");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-trash-alt"></i> 清空所有数据';
            }
        }

        function showToast(message, type = "info") {
            els.toastMessage.innerText = message;
            els.toastIcon.className = '';
            if (type === 'success') els.toastIcon.className = 'fas fa-check-circle text-green-400';
            else if (type === 'error') els.toastIcon.className = 'fas fa-exclamation-circle text-red-400';
            else if (type === 'warning') els.toastIcon.className = 'fas fa-exclamation-triangle text-yellow-400';
            else els.toastIcon.className = 'fas fa-info-circle text-blue-400';

            els.toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => els.toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        function escapeHtml(unsafe) {
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function openModal(modalEl) {
            modalEl.classList.remove('hidden');
            setTimeout(() => {
                modalEl.classList.remove('opacity-0', 'pointer-events-none');
                modalEl.querySelector('div').classList.remove('scale-95');
                modalEl.querySelector('div').classList.add('scale-100');
                document.body.classList.add('modal-active');
            }, 10);
        }

        function closeModal(modalEl) {
            modalEl.classList.add('opacity-0', 'pointer-events-none');
            modalEl.querySelector('div').classList.remove('scale-100');
            modalEl.querySelector('div').classList.add('scale-95');
            document.body.classList.remove('modal-active');
            setTimeout(() => modalEl.classList.add('hidden'), 250);
        }

        // Event Listeners
        els.drawBtn.addEventListener('click', handleDraw);
        els.userNameInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') handleDraw(); });
        
        els.adminLoginBtn.addEventListener('click', () => {
            els.adminPassword.value = '';
            els.loginError.classList.add('hidden');
            openModal(els.loginModal);
        });
        
        els.closeLoginModal.addEventListener('click', () => closeModal(els.loginModal));
        
        els.doLoginBtn.addEventListener('click', () => {
            if (els.adminPassword.value === '12345') {
                closeModal(els.loginModal);
                toggleAdminMode(true);
                showToast(isCloudMode ? "管理员登录成功" : "本地模式：管理员登录成功", "success");
            } else {
                els.loginError.classList.remove('hidden');
            }
        });

        els.adminPassword.addEventListener('keypress', (e) => { if(e.key === 'Enter') els.doLoginBtn.click(); });
        els.adminLogoutBtn.addEventListener('click', () => { toggleAdminMode(false); showToast("已退出管理员模式"); });
        els.viewUserModeBtn.addEventListener('click', switchToUserView);
        els.refreshDataBtn.addEventListener('click', () => { setupRealtimeListeners(); showToast("数据已刷新", "success"); });
        els.clearAllBtn.addEventListener('click', clearAllData);
        els.closeAddModal.addEventListener('click', () => closeModal(els.addMemberModal));
        els.doAddMemberBtn.addEventListener('click', manualAddMember);
        els.newMemberName.addEventListener('keypress', (e) => { if(e.key === 'Enter') manualAddMember(); });

        window.addEventListener('DOMContentLoaded', () => {
            initAuth();
            if (!isCloudMode) {
                showToast("当前为本地演示模式", "warning");
            }
        });

    </script>
</body>
</html>
